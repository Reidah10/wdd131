<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Load</title>
    <meta name="author" content="Reid Howard">
    <link rel="stylesheet" href="styles/lazyload.css">
</head>
<body>
    <h1>
        Lazy Load Demonstration
    </h1>
    <main>
        <picture>
            <img src="https://placekitten.com/400/600" alt="Placeholder Kitten Image" loading="lazy" width="400" height="600">
        </picture>
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Dolore, maxime harum? Sint, atque. Eaque ipsa natus numquam. Earum in, corrupti ut excepturi, laudantium ipsam possimus totam aut laboriosam, ad quis! </p>
        <picture>
            <img src="https://placekitten.com/400/700" alt="Placeholder Kitten Image" width="400" height="600">
        </picture>
        <picture>
            <img src="https://placekitten.com/400/800" alt="Placeholder Kitten Image" width="400" height="600">
        </picture>
        <picture>
            <img src="https://placekitten.com/400/650" alt="Placeholder Kitten Image" width="400" height="600">
        </picture>
        <picture>
            <img src="https://placekitten.com/400/750" alt="Placeholder Kitten Image" width="400" height="600">
        </picture>
        <picture>
            <img src="https://placekitten.com/400/850" alt="Placeholder Kitten Image" width="400" height="600">
        </picture>
    </main>
</body>
</html>
