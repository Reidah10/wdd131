<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="Week 05 Product review form assignment for practing how to write good forms using HTML and Javascript to make it dynamic.">
    <meta name="author" content="Reid Howard">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <label for="productName">Product Name</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>

                <div class="stars">
                    <input type="radio" id="fivestar" name="rating" value="5" required>
                    <label for="fivestar"></label>

                    <input type="radio" id="fourstar" name="rating" value="4" required>
                    <label for="fourstar"></label>

                    <input type="radio" id="threestar" name="rating" value="3" required>
                    <label for="threestar"></label>

                    <input type="radio" id="twostar" name="rating" value="2" required>
                    <label for="twostar"></label>

                    <input type="radio" id="onestar" name="rating" value="1" required>
                    <label for="onestar"></label>
                </div>
            </fieldset>

            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Useful Features</legend>
                <label for="durability">
                    <input type="checkbox" id="durability" name="features" value="durablity">
                    Durability
                </label>

                <label for="easeOfUse">
                    <input type="checkbox" id="easeOfUse" name="features" value="easeOfUse">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox" id="design" name="features" value="design">
                    Design
                </label>
            </fieldset>

            <label for="writtenReview">Written Review</label>
            <textarea id="writtenReview" name="writtenReview"></textarea>

            <label for="userName">User Name</label>
            <input type="text" id="userName" name="userName">

            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> | Reid Howard | United States</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
